[package]
name = "belling-cat-comic"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "=0.19.0", default-features = false, features = ["2d"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Hot reload of scene files while the editor saves them; not available on the web.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy = { version = "=0.19.0", default-features = false, features = ["2d", "file_watcher"] }

[[bin]]
name = "belling-cat-comic"
path = "src/main.rs"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
