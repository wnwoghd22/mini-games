[package]
name = "belling-cat-comic"
version = "0.1.0"
edition = "2024"

[features]
default = ["rendering"]
rendering = ["dep:bevy"]

[dependencies]
bevy = { version = "=0.19.0", optional = true, default-features = false, features = ["2d"] }

[[bin]]
name = "belling-cat-comic"
path = "src/main.rs"
required-features = ["rendering"]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
