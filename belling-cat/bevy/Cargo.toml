[package]
name = "belling-cat-comic"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "=0.19.0", default-features = false, features = ["2d"] }

[[bin]]
name = "belling-cat-comic"
path = "src/main.rs"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
