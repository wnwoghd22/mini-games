<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e8dfcc">
  <title>Belling the Cat — A story between the lines</title>
  <link data-trunk rel="rust" data-wasm-opt="z"
    data-wasm-opt-params="--enable-bulk-memory --enable-nontrapping-float-to-int --enable-sign-ext">
  <link data-trunk rel="copy-dir" href="assets">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #28241f; }
    body { display: grid; place-items: center; min-height: 100dvh; padding: 16px; }
    main { width: min(1080px, 95vw, calc(94dvh * 1080 / 940)); aspect-ratio: 1080 / 940;
      background: #e8dfcc; box-shadow: 0 18px 65px #0006; position: relative; }
    canvas { display: block; width: 100%; height: 100%; outline: none; }
    #loading { position: absolute; inset: 0; display: grid; place-items: center;
      color: #29251f; font: 15px Georgia, serif; pointer-events: none; }
    #error { padding: 2rem; color: #eee; font: 16px/1.7 system-ui; display: none; }
  </style>
</head>
<body>
  <main aria-label="Belling the Cat comic game. Arrow keys or A and D to move, Space to jump, Z to inspect and advance dialogue.">
    <div id="loading">Opening the sketchbook...</div>
    <canvas id="bevy-canvas" tabindex="0" aria-label="Game canvas"></canvas>
  </main>
  <div id="error" role="alert"></div>
  <script>
    addEventListener('TrunkApplicationStarted', () => {
      document.getElementById('loading')?.remove();
      document.getElementById('bevy-canvas').focus();
    });
    addEventListener('TrunkApplicationStartFailed', (event) => {
      const error = document.getElementById('error');
      error.style.display = 'block';
      error.textContent = 'The sketchbook could not open. Try a recent browser with WebGL2 enabled. ' + (event.detail?.error || '');
      document.getElementById('loading')?.remove();
    });
    document.getElementById('bevy-canvas').addEventListener('pointerdown', (event) => event.currentTarget.focus());
  </script>
</body>
</html>
