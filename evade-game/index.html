<!doctype html>
<html lang="ko">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Duck &amp; Chuck</title>
  <style>
    :root {
      --bg-1: #0b1024;
      --text: #e9edf9;
      --muted: #9fb3d8;
      --accent: #6de4ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 14px;
      font-family: 'Space Grotesk', 'Pretendard Variable', system-ui, -apple-system, sans-serif;
      background: radial-gradient(80% 80% at 50% 15%, #1d2c58 0%, #0c152f 55%, #070c1b 100%);
      color: var(--text);
    }

    h1 {
      margin: 0;
      font-size: 1.6rem;
      letter-spacing: 0.06em;
    }

    h1 span {
      color: var(--accent);
    }

    #bevy-canvas {
      width: 900px;
      height: 700px;
      max-width: 96vw;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.55);
      outline: none;
      background: #14161f;
    }

    .hint {
      margin: 0;
      color: var(--muted);
      font-size: 0.9rem;
      text-align: center;
      line-height: 1.6;
    }

    .hint b {
      color: var(--text);
    }
  </style>
  <link data-trunk rel="rust" data-wasm-opt="z"
    data-wasm-opt-params="--enable-bulk-memory --enable-nontrapping-float-to-int --enable-sign-ext" />
  <link data-trunk rel="copy-dir" href="assets" />
</head>

<body>
  <h1>DUCK <span>&amp;</span> CHUCK</h1>
  <canvas id="bevy-canvas"></canvas>
</body>

</html>
