<!doctype html>
<html lang="ko">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>REVERSE</title>
  <style>
    :root {
      --bg-1: #0b0b12;
      --text: #ececf4;
      --muted: #8f8fa8;
      --accent: #ff4f6e;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 14px;
      font-family: 'Space Grotesk', 'Pretendard Variable', system-ui, -apple-system, sans-serif;
      background: radial-gradient(80% 80% at 50% 15%, #1c1c2c 0%, #0e0e18 55%, #070710 100%);
      color: var(--text);
    }

    h1 {
      margin: 0;
      font-size: 1.6rem;
      letter-spacing: 0.18em;
    }

    h1 span {
      color: var(--accent);
    }

    #bevy-canvas {
      width: 960px;
      height: 720px;
      max-width: 96vw;
      image-rendering: pixelated;
      border-radius: 6px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.65);
      outline: none;
      background: #12121a;
    }

    .hint {
      margin: 0;
      color: var(--muted);
      font-size: 0.9rem;
      text-align: center;
      line-height: 1.6;
    }

    .hint b {
      color: var(--text);
    }
  </style>
  <link data-trunk rel="rust" data-wasm-opt="z"
    data-wasm-opt-params="--enable-bulk-memory --enable-nontrapping-float-to-int --enable-sign-ext" />
</head>

<body>
  <h1>RE<span>VERSE</span></h1>
  <canvas id="bevy-canvas"></canvas>
  <p class="hint">
    <b>방향키 / WASD</b> 이동 · <b>Z / Space</b> 사격 · <b>Shift</b> 물질계 ↔ 반물질계 전환<br />
    빨강은 물질, 파랑은 반물질. 같은 계의 적·탄·벽만 나와 부딪히고, 활성화된 벽에 닿으면 격추된다.
  </p>
</body>

</html>
